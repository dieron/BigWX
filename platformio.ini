; BigWX - large-print weather display for the LilyGO T-Display S3
;   Build:   pio run
;   Flash:   pio run -t upload            (add --upload-port COMx if more than one board is connected)
;   Log:     pio device monitor

[env:t-display-s3]
platform = espressif32@6.9.0          ; Arduino-ESP32 2.0.17 (TFT_eSPI 2.5.x does not support 3.x)
board = lilygo-t-display-s3
framework = arduino
monitor_speed = 115200
board_build.partitions = default_16MB.csv   ; 2 x 6.25 MB app slots, so updates over WiFi work

lib_deps =
    bodmer/TFT_eSPI@2.5.43
    bblanchon/ArduinoJson@7.2.1
    tzapu/WiFiManager@2.0.17

build_flags =
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DBOARD_HAS_PSRAM
    ; TFT_eSPI display setup for the T-Display S3 (8-bit parallel ST7789), no library edits needed
    -DUSER_SETUP_LOADED=1
    -include $PROJECT_LIBDEPS_DIR/$PIOENV/TFT_eSPI/User_Setups/Setup206_LilyGo_T_Display_S3.h
